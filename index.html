<!DOCTYPE html>
<html lang="en-CA" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Improv Scene Starter</title>
<style>
  :root {
    --bg: #0b0b0f;
    --panel: #17171f;
    --panel-edge: #3a3a4a;
    --text: #ffffff;
    --muted: #c9c9d6;
    --accent: #ffd400;
    --accent-text: #000000;
    --c-character: #5fd4ff;
    --c-setting: #7dff8a;
    --c-problem: #ff8f6b;
    --c-twist: #e9a3ff;
    --locked: #ffd400;
    --danger: #ff5c5c;
  }
  :root[data-theme="light"] {
    --bg: #ffffff;
    --panel: #f2f2f5;
    --panel-edge: #1a1a1a;
    --text: #000000;
    --muted: #2b2b2b;
    --accent: #0033cc;
    --accent-text: #ffffff;
    --c-character: #005a8c;
    --c-setting: #0b6b1a;
    --c-problem: #a12a00;
    --c-twist: #6a1b8a;
    --locked: #0033cc;
    --danger: #b00000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    padding: clamp(10px, 1.4vw, 28px);
    gap: clamp(10px, 1.2vw, 22px);
  }
  button {
    font: inherit;
    cursor: pointer;
    color: var(--text);
    background: var(--panel);
    border: 3px solid var(--panel-edge);
    border-radius: 12px;
    padding: 0.35em 0.8em;
    font-weight: 700;
  }
  button:hover { border-color: var(--text); }
  button:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  button[aria-pressed="true"].seg {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }

  /* ---------- Top bar ---------- */
  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: clamp(8px, 1vw, 18px);
    font-size: clamp(1rem, 1.5vw, 1.8rem);
  }
  h1 {
    margin: 0 auto 0 0;
    font-size: clamp(1.4rem, 2.6vw, 3rem);
    letter-spacing: 0.02em;
  }
  h1 span { color: var(--accent); }
  .group {
    display: inline-flex;
    gap: 0;
    border-radius: 12px;
    overflow: hidden;
    border: 3px solid var(--panel-edge);
  }
  .group button { border: 0; border-radius: 0; border-right: 3px solid var(--panel-edge); }
  .group button:last-child { border-right: 0; }
  .group-label {
    font-size: 0.75em;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    font-weight: 700;
    margin-right: 0.3em;
  }
  .ctl { display: inline-flex; align-items: center; }

  /* ---------- Main area ---------- */
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: clamp(10px, 1.2vw, 22px);
    min-height: 0;
  }
  .slot {
    background: var(--panel);
    border: 4px solid var(--panel-edge);
    border-radius: 20px;
    padding: clamp(12px, 1.4vw, 28px);
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
  }
  .slot.locked { border-color: var(--locked); border-style: dashed; }
  .slot-head {
    display: flex;
    align-items: center;
    gap: 0.5em;
    font-size: clamp(1rem, 1.6vw, 2rem);
  }
  .slot-title {
    margin: 0 auto 0 0;
    font-size: clamp(1.3rem, 2.3vw, 2.8rem);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 900;
  }
  .slot[data-slot="character"] .slot-title { color: var(--c-character); }
  .slot[data-slot="setting"] .slot-title { color: var(--c-setting); }
  .slot[data-slot="problem"] .slot-title { color: var(--c-problem); }
  .slot[data-slot="twist"] .slot-title { color: var(--c-twist); }
  .slot-head button { padding: 0.25em 0.6em; }
  .lock-btn[aria-pressed="true"] {
    background: var(--bg);
    color: var(--locked);
    border-color: var(--locked);
  }
  .slot-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0.4em;
    min-height: 0;
  }
  .value {
    font-size: clamp(1.7rem, 3.4vw, 4.4rem);
    line-height: 1.15;
    font-weight: 800;
    overflow-wrap: anywhere;
  }
  .value.placeholder { color: var(--muted); font-weight: 600; font-style: italic; }
  .pair .value { font-size: clamp(1.4rem, 2.6vw, 3.4rem); }
  .tag {
    display: inline-block;
    min-width: 1.6em;
    text-align: center;
    margin-right: 0.35em;
    padding: 0 0.25em;
    border-radius: 8px;
    background: var(--c-character);
    color: var(--bg);
    font-weight: 900;
  }
  .rolling .value { opacity: 0.55; }

  /* ---------- Bottom bar ---------- */
  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: clamp(10px, 1.4vw, 26px);
  }
  #spinBtn {
    font-size: clamp(2rem, 4vw, 5rem);
    padding: 0.15em 1.2em;
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
    border-radius: 18px;
    font-weight: 900;
    letter-spacing: 0.04em;
  }
  #spinBtn:hover { filter: brightness(1.1); }
  .timer {
    display: flex;
    align-items: center;
    gap: clamp(8px, 1vw, 18px);
    margin-left: auto;
    font-size: clamp(1rem, 1.5vw, 1.8rem);
    flex-wrap: wrap;
  }
  #timeDisplay {
    font-size: clamp(2.6rem, 5.5vw, 7rem);
    font-weight: 900;
    font-variant-numeric: tabular-nums;
    min-width: 3.4em;
    text-align: center;
    padding: 0 0.2em;
    border-radius: 14px;
    border: 4px solid var(--panel-edge);
    line-height: 1.1;
  }
  #timeDisplay.low { color: var(--danger); border-color: var(--danger); }
  #timeDisplay.done { background: var(--danger); color: #fff; border-color: var(--danger); animation: flash 0.8s step-end 4; }
  @keyframes flash { 0% { background: var(--danger); color: #fff; } 50% { background: transparent; color: var(--danger); } }
  .hint {
    width: 100%;
    color: var(--muted);
    font-size: clamp(0.9rem, 1.1vw, 1.3rem);
    text-align: center;
  }
  kbd {
    border: 2px solid var(--muted);
    border-radius: 6px;
    padding: 0 0.35em;
    font-family: inherit;
    font-weight: 700;
  }

  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; grid-template-rows: none; }
    .timer { margin-left: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    #timeDisplay.done { animation: none; }
  }
</style>
</head>
<body>

<header>
  <h1>🎭 Improv <span>Scene Starter</span></h1>

  <div class="ctl">
    <span class="group-label" id="levelLabel">Level</span>
    <div class="group" role="group" aria-labelledby="levelLabel">
      <button class="seg" data-level="simple" aria-pressed="true">Simple</button>
      <button class="seg" data-level="tricky" aria-pressed="false">Tricky</button>
      <button class="seg" data-level="both" aria-pressed="false">Both</button>
    </div>
  </div>

  <button id="pairBtn" class="seg" aria-pressed="false" title="Two different characters (P)">👥 Pair up</button>
  <button id="themeBtn" title="Switch light/dark theme (L)">☀️ Light</button>
</header>

<main>
  <section class="slot" data-slot="character" aria-live="polite">
    <div class="slot-head">
      <h2 class="slot-title">Character</h2>
      <button class="respin-btn" title="Re-spin this slot (1)" aria-label="Re-spin Character">🔄</button>
      <button class="lock-btn" aria-pressed="false" title="Lock this slot" aria-label="Lock Character">🔓</button>
    </div>
    <div class="slot-body"><div class="value placeholder">Press Spin!</div></div>
  </section>

  <section class="slot" data-slot="setting" aria-live="polite">
    <div class="slot-head">
      <h2 class="slot-title">Setting</h2>
      <button class="respin-btn" title="Re-spin this slot (2)" aria-label="Re-spin Setting">🔄</button>
      <button class="lock-btn" aria-pressed="false" title="Lock this slot" aria-label="Lock Setting">🔓</button>
    </div>
    <div class="slot-body"><div class="value placeholder">Press Spin!</div></div>
  </section>

  <section class="slot" data-slot="problem" aria-live="polite">
    <div class="slot-head">
      <h2 class="slot-title">Problem</h2>
      <button class="respin-btn" title="Re-spin this slot (3)" aria-label="Re-spin Problem">🔄</button>
      <button class="lock-btn" aria-pressed="false" title="Lock this slot" aria-label="Lock Problem">🔓</button>
    </div>
    <div class="slot-body"><div class="value placeholder">Press Spin!</div></div>
  </section>

  <section class="slot" data-slot="twist" aria-live="polite">
    <div class="slot-head">
      <h2 class="slot-title">Twist</h2>
      <button class="respin-btn" title="Re-spin this slot (4)" aria-label="Re-spin Twist">🔄</button>
      <button class="lock-btn" aria-pressed="false" title="Lock this slot" aria-label="Lock Twist">🔓</button>
    </div>
    <div class="slot-body"><div class="value placeholder">Press Spin!</div></div>
  </section>
</main>

<footer>
  <button id="spinBtn" title="Spin all unlocked slots (Space)">🎲 SPIN</button>

  <div class="timer">
    <div class="group" role="group" aria-label="Timer length">
      <button class="seg" data-secs="60" aria-pressed="true">60s</button>
      <button class="seg" data-secs="90" aria-pressed="false">90s</button>
      <button class="seg" data-secs="120" aria-pressed="false">120s</button>
    </div>
    <div id="timeDisplay" role="timer" aria-live="off">1:00</div>
    <button id="startBtn" title="Start / pause (T)">▶ Start</button>
    <button id="resetBtn" title="Reset timer (R)">↺ Reset</button>
  </div>

  <div class="hint">
    <kbd>Space</kbd> spin &nbsp;·&nbsp; <kbd>T</kbd> start/pause timer &nbsp;·&nbsp; <kbd>R</kbd> reset timer &nbsp;·&nbsp;
    <kbd>1</kbd>–<kbd>4</kbd> re-spin a slot &nbsp;·&nbsp; <kbd>P</kbd> pair up &nbsp;·&nbsp; <kbd>L</kbd> light/dark
  </div>
</footer>

      "the scene freezes and each character tells the audience a secret thought",
      "everything must be said as if it were a huge compliment",
      "the scene is told as a bedtime story"
    ]
  }
};

const SLOTS = ["character", "setting", "problem", "twist"];

/* =========================================================
   STATE
   ========================================================= */
const state = {
  level: "simple",
  pair: false,
  locked: { character: false, setting: false, problem: false, twist: false },
  values: { character: null, setting: null, problem: null, twist: null },
  bags: {}
};

function store(key, val) { try { localStorage.setItem(key, val); } catch (e) { /* ignore */ } }
function load(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }

function pool(slot) {
  const b = BANKS[slot];
  if (state.level === "simple") return b.simple;
  if (state.level === "tricky") return b.tricky;
  return b.simple.concat(b.tricky);
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Shuffle-bag picking: no repeats until the whole bank has been used. */
function draw(slot, exclude) {
  const key = slot + ":" + state.level;
  const all = pool(slot);
  for (let tries = 0; tries < 3; tries++) {
    if (!state.bags[key] || state.bags[key].length === 0) state.bags[key] = shuffle(all);
    const bag = state.bags[key];
    const idx = bag.findIndex(x => !exclude.includes(x));
    if (idx !== -1) return bag.splice(idx, 1)[0];
    state.bags[key] = [];
  }
  return all.find(x => !exclude.includes(x)) || all[0];
}

function current(slot) {
  const v = state.values[slot];
  return v ? [].concat(v) : [];
}

function pickFor(slot) {
  const prev = current(slot);
  if (slot === "character" && state.pair) {
    const a = draw(slot, prev);
    const b = draw(slot, prev.concat([a]));
    return [a, b];
  }
  return draw(slot, prev);
}

/* =========================================================
   RENDERING
   ========================================================= */
const el = {};
SLOTS.forEach(s => {
  const sec = document.querySelector('.slot[data-slot="' + s + '"]');
  el[s] = {
    section: sec,
    body: sec.querySelector(".slot-body"),
    lock: sec.querySelector(".lock-btn"),
    respin: sec.querySelector(".respin-btn")
  };
});

function setBody(slot, v) {
  const body = el[slot].body;
  body.textContent = "";
  body.classList.toggle("pair", Array.isArray(v));
  if (v == null) {
    const d = document.createElement("div");
    d.className = "value placeholder";
    d.textContent = "Press Spin!";
    body.appendChild(d);
    return;
  }
  if (Array.isArray(v)) {
    v.forEach((txt, i) => {
      const d = document.createElement("div");
      d.className = "value";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = i === 0 ? "A" : "B";
      d.appendChild(tag);
      d.appendChild(document.createTextNode(capitalize(txt)));
      body.appendChild(d);
    });
  } else {
    const d = document.createElement("div");
    d.className = "value";
    d.textContent = capitalize(v);
    body.appendChild(d);
  }
}

function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

function renderLocks() {
  SLOTS.forEach(s => {
    const on = state.locked[s];
    el[s].section.classList.toggle("locked", on);
    el[s].lock.setAttribute("aria-pressed", String(on));
    el[s].lock.textContent = on ? "🔒 LOCKED" : "🔓";
    el[s].lock.title = on ? "Unlock this slot" : "Lock this slot";
    el[s].respin.disabled = on;
  });
}

/* Short "slot machine" roll before landing on the real pick. */
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const rolling = {};

function spinSlots(slots) {
  slots.forEach(slot => {
    const finalVal = pickFor(slot);
    state.values[slot] = finalVal;
    if (rolling[slot]) clearInterval(rolling[slot]);
    if (reduceMotion) { setBody(slot, finalVal); return; }
    const all = pool(slot);
    const rnd = () => all[Math.floor(Math.random() * all.length)];
    let frames = 7;
    el[slot].section.classList.add("rolling");
    rolling[slot] = setInterval(() => {
      if (--frames <= 0) {
        clearInterval(rolling[slot]);
        rolling[slot] = null;
        el[slot].section.classList.remove("rolling");
        setBody(slot, finalVal);
      } else {
        setBody(slot, Array.isArray(finalVal) ? [rnd(), rnd()] : rnd());
      }
    }, 55);
  });
}

function spinAll() {
  spinSlots(SLOTS.filter(s => !state.locked[s]));
}

function respin(slot) {
  if (!state.locked[slot]) spinSlots([slot]);
}

/* =========================================================
   CONTROLS
   ========================================================= */
document.getElementById("spinBtn").addEventListener("click", spinAll);

SLOTS.forEach(s => {
  el[s].respin.addEventListener("click", () => respin(s));
  el[s].lock.addEventListener("click", () => {
    state.locked[s] = !state.locked[s];
    renderLocks();
  });
});

document.querySelectorAll("[data-level]").forEach(btn => {
  btn.addEventListener("click", () => setLevel(btn.dataset.level));
});
function setLevel(level) {
  state.level = level;
  document.querySelectorAll("[data-level]").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.level === level)));
}

const pairBtn = document.getElementById("pairBtn");
pairBtn.addEventListener("click", togglePair);
function togglePair() {
  state.pair = !state.pair;
  pairBtn.setAttribute("aria-pressed", String(state.pair));
  const v = state.values.character;
  if (state.pair && typeof v === "string") {
    // keep the existing character as A and add a different B
    state.values.character = [v, draw("character", [v])];
    setBody("character", state.values.character);
  } else if (!state.pair && Array.isArray(v)) {
    state.values.character = v[0];
    setBody("character", v[0]);
  }
}

const themeBtn = document.getElementById("themeBtn");
function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "☀️ Light" : "🌙 Dark";
  store("improv-theme", t);
}
themeBtn.addEventListener("click", () =>
  applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));
applyTheme(load("improv-theme") === "light" ? "light" : "dark");

/* =========================================================
   TIMER
   ========================================================= */
const timer = { length: 60, remaining: 60, running: false, endAt: 0, tick: null };
const timeDisplay = document.getElementById("timeDisplay");
const startBtn = document.getElementById("startBtn");
let audioCtx = null;

function fmt(sec) {
  const s = Math.max(0, Math.ceil(sec));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function renderTimer() {
  timeDisplay.textContent = fmt(timer.remaining);
  timeDisplay.classList.toggle("low", timer.remaining > 0 && timer.remaining <= 10);
  startBtn.textContent = timer.running ? "⏸ Pause" : (timer.remaining <= 0 ? "▶ Again" : "▶ Start");
}

function ensureAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) { audioCtx = null; }
}

function beep() {
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime;
    [0, 0.35, 0.7].forEach((offset, i) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = i === 2 ? 1046 : 880;
      const start = t0 + offset, dur = i === 2 ? 0.6 : 0.25;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.35, start + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(start);
      osc.stop(start + dur + 0.05);
    });
  } catch (e) { /* audio unavailable */ }
}

function startTimer() {
  ensureAudio();
  if (timer.remaining <= 0) timer.remaining = timer.length;
  timeDisplay.classList.remove("done");
  timer.running = true;
  timer.endAt = performance.now() + timer.remaining * 1000;
  clearInterval(timer.tick);
  timer.tick = setInterval(onTick, 200);
  renderTimer();
}

function pauseTimer() {
  timer.remaining = Math.max(0, (timer.endAt - performance.now()) / 1000);
  timer.running = false;
  clearInterval(timer.tick);
  renderTimer();
}

function resetTimer() {
  timer.running = false;
  clearInterval(timer.tick);
  timer.remaining = timer.length;
  timeDisplay.classList.remove("done");
  renderTimer();
}

function onTick() {
  timer.remaining = (timer.endAt - performance.now()) / 1000;
  if (timer.remaining <= 0) {
    timer.remaining = 0;
    timer.running = false;
    clearInterval(timer.tick);
    timeDisplay.classList.add("done");
    beep();
  }
  renderTimer();
}

function toggleTimer() { timer.running ? pauseTimer() : startTimer(); }

startBtn.addEventListener("click", toggleTimer);
document.getElementById("resetBtn").addEventListener("click", resetTimer);
document.querySelectorAll("[data-secs]").forEach(btn => {
  btn.addEventListener("click", () => {
    timer.length = Number(btn.dataset.secs);
    document.querySelectorAll("[data-secs]").forEach(b =>
      b.setAttribute("aria-pressed", String(b === btn)));
    resetTimer();
  });
});
renderTimer();

/* =========================================================
   KEYBOARD SHORTCUTS
   ========================================================= */
document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target && e.target.tagName) || "";
  if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const k = e.key.toLowerCase();
  if (e.code === "Space" || k === " ") {
    e.preventDefault();          // stop page scroll and focused-button "click"
    if (!e.repeat) spinAll();
  } else if (k === "t") {
    if (!e.repeat) toggleTimer();
  } else if (k === "r") {
    resetTimer();
  } else if (k === "p") {
    togglePair();
  } else if (k === "l") {
    themeBtn.click();
  } else if (["1", "2", "3", "4"].includes(k)) {
    respin(SLOTS[Number(k) - 1]);
  }
});
// Space on a focused button fires its click on keyup; block it so Space only spins.
document.addEventListener("keyup", e => {
  if (e.code === "Space" && e.target && e.target.tagName === "BUTTON") e.preventDefault();
});
// Mouse clicks shouldn't leave focus on a button (keeps Space/T predictable).
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("button");
  if (b && e.detail > 0) b.blur();
});

renderLocks();
</script>
